<div class="cadastro-container">
  <h2>Cadastro de Montadora</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="descricao">Descrição</label>
      <input id="descricao" formControlName="descricao" />
      <small *ngIf="form.get('descricao')?.invalid && form.get('descricao')?.touched">Descrição é obrigatória</small>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="form.invalid">Salvar</button>
    </div>
  </form>
</div>
