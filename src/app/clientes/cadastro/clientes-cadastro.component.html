<div class="cadastro-container">
  <h2>Cadastro de Cliente</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="documento">Documento</label>
      <input id="documento" formControlName="documento" (input)="onDocumentoInput($event)" maxlength="14" placeholder="000.000.000-00" />
      <small *ngIf="form.get('documento')?.hasError('required') && form.get('documento')?.touched">Documento é obrigatório</small>
      <small *ngIf="form.get('documento')?.hasError('invalidCpfLength') && form.get('documento')?.touched">CPF inválido (deve conter 11 dígitos)</small>
    </div>

    <div class="field">
      <label for="nome">Nome</label>
      <input id="nome" formControlName="nome" />
      <small *ngIf="form.get('nome')?.invalid && form.get('nome')?.touched">Nome é obrigatório</small>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input id="email" formControlName="email" />
      <small *ngIf="form.get('email')?.invalid && form.get('email')?.touched">Email inválido</small>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="form.invalid">Salvar</button>
    </div>
  </form>

  <div class="modal-backdrop" *ngIf="showModal" (click)="closeModal()">
    <div class="modal-box" (click)="$event.stopPropagation()">
      <h3>{{ modalTitle }}</h3>
      <p>{{ modalMessage }}</p>
      <button type="button" (click)="closeModal()">Fechar</button>
    </div>
  </div>

  <ngx-loading [show]="loading" [config]="{ backdrop: true, primaryColour: '#2F4F7F', secondaryColour: '#000000', tertiaryColour: '#ffffff' }"></ngx-loading>
</div>
