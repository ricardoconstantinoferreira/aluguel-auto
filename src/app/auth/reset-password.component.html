<div class="reset-container">
  <h2>Criar Senha</h2>

  <form [formGroup]="form" (ngSubmit)="onSubmit()">
    <div class="field">
      <label for="password">Senha</label>
      <input id="password" type="password" formControlName="password" />
      <small *ngIf="form.get('password')?.hasError('required') && form.get('password')?.touched">Senha é obrigatória</small>
      <small *ngIf="form.get('password')?.hasError('minlength') && form.get('password')?.touched">Mínimo 6 caracteres</small>
    </div>

    <div class="field">
      <label for="confirmPassword">Confirmar Senha</label>
      <input id="confirmPassword" type="password" formControlName="confirmPassword" />
      <small *ngIf="form.get('confirmPassword')?.hasError('required') && form.get('confirmPassword')?.touched">Confirmação é obrigatória</small>
      <small *ngIf="form.hasError('passwordsMismatch') && form.get('confirmPassword')?.touched">As senhas não coincidem</small>
    </div>

    <div class="actions">
      <button type="submit" [disabled]="form.invalid">Criar senha</button>
    </div>
  </form>
</div>
